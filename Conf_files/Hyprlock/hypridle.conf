general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = [ -n "${NIRI_SOCKET:-}" ] && niri msg action power-on-monitors || hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Abbassa la luminosita dopo 2.5 min (solo se esiste una retroilluminazione laptop)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# Blocca lo schermo dopo 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Spegne i monitor dopo 5.5 min
listener {
    timeout = 330
    on-timeout = [ -n "${NIRI_SOCKET:-}" ] && niri msg action power-off-monitors || hyprctl dispatch dpms off
    on-resume = [ -n "${NIRI_SOCKET:-}" ] && niri msg action power-on-monitors || hyprctl dispatch dpms on
}

# Sospensione dopo 10 min (installer la trasforma in suspend-then-hibernate se HIB=1 e HIB_DELAY>0)
listener {
    timeout = 600
    on-timeout = loginctl suspend
}
