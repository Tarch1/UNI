# ==============================================================================
# USER CONFIGURATION & TUNING VARIABLES (HYPRLAND)
# ==============================================================================
# 1. Default Tiling Layout (toggled dynamically with Super + X):
#    Options: dwindle (Dynamic spiral) | master (Main window + side stack)
$defaultLayout = dwindle

# 2. Window Gaps & Border Radius:
#    gapsIn: 4 - 10 | gapsOut: 10 - 24 | borderSize: 1 - 4 | rounding: 0 - 16
$gapsIn = 6
$gapsOut = 14
$borderSize = 2
$rounding = 10

# 3. Blur Settings (Real-time background blur under Quickshell / Waybar & Apps):
#    blurEnabled: true | false (Can also be toggled in Quickshell Battery menu)
#    blurSize: 4 - 12 | blurPasses: 1 - 4
$blurEnabled = true
$blurSize = 6
$blurPasses = 3

# 4. Primary Applications:
$mainMod = SUPER
$terminal = kitty
$fileManager = pcmanfm-qt
$browser = firefox
$menu = fuzzel
# ==============================================================================

source = ~/.config/hypr/colors.conf

monitor = , preferred, auto, 1

# --- STARTUP PROCESSES ---
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper & ~/.config/wallpapers/theme-switcher.sh
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# --- ENVIRONMENT ---
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- GENERAL & LAYOUT ---
general {
    gaps_in = $gapsIn
    gaps_out = $gapsOut
    border_size = $borderSize
    col.active_border = $color4 $color6 45deg
    col.inactive_border = $background
    resize_on_border = true
    allow_tearing = false
    layout = $defaultLayout
}

decoration {
    rounding = $rounding
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = $blurEnabled
        size = $blurSize
        passes = $blurPasses
        new_optimizations = true
        ignore_opacity = false
        xray = false
    }
}

animations {
    enabled = true
    bezier = fluent_decel, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, easeOutExpo, popin 80%
    animation = windowsOut, 1, 3, easeOutExpo, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, fluent_decel, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.5
}

input {
    kb_layout = it
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# --- NATIVE TOUCHPAD GESTURES (3-FINGER, 4-FINGER & PINCH) ---
gesture = 3, up, dispatcher, exec, command -v quickshell >/dev/null && quickshell ipc call overview toggle || hyprctl dispatch cyclenext
gesture = 3, down, dispatcher, exec, command -v quickshell >/dev/null && quickshell ipc call overview close || hyprctl dispatch cyclenext, prev
gesture = 4, down, dispatcher, exec, bash -c 'addr=$(hyprctl activewindow -j | awk -F\" "/\"address\":/{print \$4; exit}"); [[ -n "$addr" ]] && { echo "$addr" >> /tmp/hypr_hidden_$UID; hyprctl dispatch movetoworkspacesilent "special:hidden,address:$addr"; }'
gesture = 4, up, dispatcher, exec, bash -c 'ws=$(hyprctl activeworkspace -j | awk -F": " "/\"id\":/{gsub(/,/,\"\",\$2); print \$2; exit}"); addr=$(tail -n 1 /tmp/hypr_hidden_$UID 2>/dev/null); if [[ -n "$addr" ]]; then sed -i "\$d" /tmp/hypr_hidden_$UID; hyprctl dispatch movetoworkspace "$ws,address:$addr"; hyprctl dispatch focuswindow "address:$addr"; fi'
gesture = 3, left, dispatcher, cyclenext, prev
gesture = 3, right, dispatcher, cyclenext
gesture = 4, horizontal, workspace
gesture = 3, pinch, fullscreen

# --- WINDOW & LAYER RULES ---
# Coordinated Transparency & Blur for Kitty, PCManFM-Qt & FeatherPad (Firefox excluded)
windowrulev2 = opacity 0.88 0.82, class:^(kitty|pcmanfm-qt|featherpad)$

windowrulev2 = float, class:^(floating-calc)$
windowrulev2 = size 520 360, class:^(floating-calc)$
windowrulev2 = center, class:^(floating-calc)$

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window

# --- KEYBINDINGS ---
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, bash -c '(command -v quickshell >/dev/null && quickshell ipc call lock lock || hyprlock &) && sleep 0.3 && (loginctl suspend || zzz)'
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, exec, kitty --class floating-calc -e qalc
bind = $mainMod, B, exec, $browser
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = CTRL SHIFT, Escape, exec, kitty -e btop

bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, X, exec, bash -c 'cur=$(hyprctl getoption general:layout -j | awk -F\" "/\"str\":/{print \$4; exit}"); [[ "$cur" == "dwindle" ]] && hyprctl keyword general:layout master || hyprctl keyword general:layout dwindle'
bind = $mainMod, M, exec, bash -c 'command -v quickshell >/dev/null && quickshell ipc call bar toggle || killall -SIGUSR1 waybar'
bind = $mainMod, Tab, exec, bash -c 'command -v quickshell >/dev/null && quickshell ipc call overview toggle || hyprctl dispatch cyclenext'

bind = $mainMod, H, exec, bash -c 'addr=$(hyprctl activewindow -j | awk -F\" "/\"address\":/{print \$4; exit}"); [[ -n "$addr" ]] && { echo "$addr" >> /tmp/hypr_hidden_$UID; hyprctl dispatch movetoworkspacesilent "special:hidden,address:$addr"; }'
bind = $mainMod SHIFT, H, exec, bash -c 'ws=$(hyprctl activeworkspace -j | awk -F": " "/\"id\":/{gsub(/,/,\"\",\$2); print \$2; exit}"); addr=$(tail -n 1 /tmp/hypr_hidden_$UID 2>/dev/null); if [[ -n "$addr" ]]; then sed -i "\$d" /tmp/hypr_hidden_$UID; hyprctl dispatch movetoworkspace "$ws,address:$addr"; hyprctl dispatch focuswindow "address:$addr"; fi'

bind = ALT, Tab, exec, bash -c 'cur=$(hyprctl activewindow -j 2>/dev/null); caddr=$(echo "$cur" | awk -F\" "/\"address\":/{print \$4; exit}"); ccls=$(echo "$cur" | awk -F\" "/\"class\":/{print \$4; exit}"); cws=$(hyprctl activeworkspace -j 2>/dev/null | awk -F: "/\"id\":/{gsub(/[^0-9-]/,\"\",\$2); print \$2; exit}"); next=$(hyprctl clients -j 2>/dev/null | awk -v caddr="$caddr" -v ccls="$ccls" -v cws="$cws" "BEGIN{RS=\"}\"}/\"address\":/{match(\$0,/\"address\": *\"[^\"]*\"/); addr=substr(\$0,RSTART+11,RLENGTH-12); gsub(/^\"|\"$/,\"\",addr); match(\$0,/\"id\": *[0-9-]+/); ws=substr(\$0,RSTART+5,RLENGTH-5); gsub(/[^0-9-]/,\"\",ws); match(\$0,/\"class\": *\"[^\"]*\"/); cls=substr(\$0,RSTART+9,RLENGTH-10); gsub(/^\"|\"$/,\"\",cls); if(ws==cws && addr!=\"\"){all[++na]=addr; if(cls==ccls) same[++ns]=addr}} END{if(ns>1){for(i=1;i<=ns;i++) if(same[i]==caddr){print same[(i%ns)+1]; exit}; print same[1]} else if(na>1){for(i=1;i<=na;i++) if(all[i]==caddr){print all[(i%na)+1]; exit}; print all[1]}}"); [[ -n "$next" ]] && hyprctl dispatch focuswindow "address:$next"'

bind = $mainMod, S, exec, bash -c 'grim - | swappy -f -'
bind = $mainMod SHIFT, S, exec, bash -c 'grim -g "$(slurp)" - | swappy -f -'
bind = $mainMod, R, exec, bash -c 'if pgrep -u $UID -x wf-recorder >/dev/null; then pkill -INT -x wf-recorder && notify-send "Screen Recorder" "Saved in ~/Videos/Recordings"; else wf-recorder -f "$HOME/Videos/Recordings/rec-$(date +%Y%m%d-%H%M%S).mp4" & notify-send "Screen Recorder" "Recording started (No Audio)"; fi'
bind = $mainMod SHIFT, R, exec, bash -c 'if pgrep -u $UID -x wf-recorder >/dev/null; then pkill -INT -x wf-recorder && notify-send "Screen Recorder" "Saved in ~/Videos/Recordings"; else sink=$(wpctl inspect @DEFAULT_AUDIO_SINK@ 2>/dev/null | awk -F\" "/node.name/{print \$2\".monitor\"; exit}"); wf-recorder -a"${sink:+=$sink}" -f "$HOME/Videos/Recordings/rec-$(date +%Y%m%d-%H%M%S).mp4" & notify-send "Screen Recorder" "Recording started (With Audio)"; fi'

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_up, cyclenext, prev
bind = $mainMod, mouse_down, cyclenext

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
