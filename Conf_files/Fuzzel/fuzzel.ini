[main]
font=monospace:size=12
dpi-aware=auto
prompt="> "
icon-theme=hicolor
icons-enabled=yes
show-actions=yes
terminal=kitty -e
lines=15
width=30
horizontal-pad=40
vertical-pad=20
inner-pad=5
image-size-ratio=0.5
line-height=20
letter-spacing=0
layer=top
exit-on-keyboard-focus-loss=yes

[colors]
# These are fallback colors.
# When we integrate Wallust, we will source the colors dynamically.
background=282a36fa
text=f8f8f2ff
match=8be9fdff
selection=44475aaa
selection-text=f8f8f2ff
selection-match=8be9fdff
border=bd93f9ff

[border]
width=2
radius=10
