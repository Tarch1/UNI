[main]
font=monospace:size=12
dpi-aware=auto
prompt="> "
icon-theme=hicolor
icons-enabled=yes
show-actions=yes
terminal=kitty -e
lines=15
width=30
horizontal-pad=40
vertical-pad=20
inner-pad=5
image-size-ratio=0.5
line-height=20
letter-spacing=0
layer=top
exit-on-keyboard-focus-loss=yes
include="~/.config/fuzzel/colors.ini"

[border]
width=2
radius=10
